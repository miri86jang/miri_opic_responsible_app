<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPIc AL Mock Test & MP Tutor</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8">
  <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-lg p-6 border border-slate-200 space-y-6">
    
    <!-- 상단 헤더 & API Key 설정 -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b pb-4 gap-4">
      <div>
        <h1 class="text-2xl font-bold text-indigo-700">🎯 OPIc AL 실전 튜터 (MP 두괄식 버전)</h1>
        <p class="text-xs text-slate-500 mt-1">설문 → 맞춤 문제 → 마이크 녹음 → ACTFL 및 첫 문장 MP 채점</p>
      </div>
      <div class="flex items-center gap-2 w-full md:w-auto">
        <input type="password" id="apiKeyInput" placeholder="Gemini API Key (AIzaSy...)" 
               class="border rounded-lg px-3 py-1.5 text-sm w-full md:w-56 focus:outline-indigo-500">
        <button onclick="saveApiKey()" class="bg-slate-800 text-white px-3 py-1.5 rounded-lg text-sm hover:bg-slate-700 shrink-0">저장</button>
      </div>
    </div>

    <!-- Step 1: 설문조사 화면 -->
    <div id="surveySection" class="space-y-4">
      <h2 class="text-lg font-semibold">📋 Step 1. Background Survey & 난이도 설정</h2>
      <div class="bg-slate-100 p-4 rounded-xl space-y-2 text-sm">
        <p class="font-medium text-slate-700">✔ 맞춤 설문 세팅 (국민 꿀설문 적용):</p>
        <label class="flex items-center gap-2"><input type="checkbox" checked disabled> 직업: 일 경험 없음 (비즈니스 질문 차단)</label>
        <label class="flex items-center gap-2"><input type="checkbox" checked disabled> 여가/취미: 영화보기, 카페가기, 음악감상, 요리, 독서</label>
        <label class="flex items-center gap-2"><input type="checkbox" checked disabled> 운동: 운동 전혀 안 함, 걷기, 조깅</label>
        <label class="flex items-center gap-2"><input type="checkbox" checked disabled> Self-Assessment: Level 5 (AL 목표)</label>
      </div>
      <button onclick="startTest()" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-xl hover:bg-indigo-500 transition">
        모의고사 시작하기 (2문항) →
      </button>
    </div>

    <!-- Step 2: 시험 및 연습 화면 -->
    <div id="testSection" class="hidden space-y-6">
      
      <!-- 문항 네비게이션 바 -->
      <div class="flex items-center justify-between bg-slate-100 p-2 rounded-xl">
        <div class="flex gap-2" id="navTabs"></div>
        <span class="text-xs text-slate-500 pr-2">원하는 문제를 클릭해 이동하세요</span>
      </div>

      <!-- 문제 카드 -->
      <div class="bg-indigo-50/60 border border-indigo-100 p-5 rounded-xl space-y-4">
        <div class="flex justify-between items-center">
          <span id="qCategory" class="text-xs font-bold uppercase tracking-wider bg-indigo-200 text-indigo-800 px-2.5 py-1 rounded-full"></span>
          <div class="flex gap-2">
            <button onclick="playQuestionTTS()" class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-sm hover:bg-indigo-500 flex items-center gap-1">
              🔊 문제 듣기 (Eva)
            </button>
            <button onclick="toggleScript()" class="bg-white border border-slate-300 text-slate-600 px-3 py-1.5 rounded-lg text-sm hover:bg-slate-50">
              👀 질문 텍스트 보기
            </button>
          </div>
        </div>
        <p id="qText" class="text-slate-800 font-medium leading-relaxed hidden border-t border-indigo-100 pt-3"></p>
      </div>

      <!-- 답변 입력 및 음성 인식 영역 -->
      <div class="space-y-3">
        <div class="flex justify-between items-center">
          <label class="text-sm font-semibold text-slate-700">🎙️ 나의 답변 (첫 문장에 MP 선제시 필수!)</label>
          <button id="recordBtn" onclick="toggleRecording()" class="bg-rose-600 text-white px-4 py-1.5 rounded-lg text-sm font-medium hover:bg-rose-500">
            ● 녹음 시작 (영어)
          </button>
        </div>
        <textarea id="answerInput" rows="5" placeholder="'녹음 시작'을 누르고 영어로 대답해 보세요. (첫 문장에 Main Point 결론이 오도록 두괄식으로 말해보세요!)"
                  class="w-full border rounded-xl p-3 text-sm focus:outline-indigo-500 leading-relaxed"></textarea>
        
        <button id="evalBtn" onclick="evaluateAnswer()" class="w-full bg-emerald-600 text-white font-semibold py-3 rounded-xl hover:bg-emerald-500 transition">
          ✅ ACTFL 및 MP 두괄식 채점 받기
        </button>
      </div>

      <!-- ACTFL 채점 결과 및 히스토리 영역 -->
      <div id="feedbackContainer" class="space-y-4 pt-4 border-t hidden">
        <div class="flex justify-between items-center">
          <h3 class="text-lg font-bold text-slate-800">📊 ACTFL & MP 평가 리포트</h3>
          <div id="attemptTabs" class="flex gap-1"></div>
        </div>
        <div id="feedbackContent" class="space-y-4"></div>
      </div>

    </div>
  </div>

  <script>
    const questions = [
      {
        id: 1,
        category: "Q1. 과거 경험 묘사 (여가/공원)",
        text: "Tell me about a memorable time you went to a park recently. Who did you go with, what did you do there, and why was it so special? Give me as many details as possible.",
        attempts: []
      },
      {
        id: 2,
        category: "Q2. 롤플레이 (카페 약속 취소 및 대안 제시)",
        text: "Here is the situation: You were supposed to meet a friend at a coffee shop today, but something urgent came up and you cannot make it. Call your friend, explain your situation in detail, and suggest two or three alternative plans.",
        attempts: []
      }
    ];

    let currentQIndex = 0;
    let recognition = null;
    let isRecording = false;

    window.onload = () => {
      const savedKey = localStorage.getItem('GEMINI_API_KEY');
      if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
      initSpeechRecognition();
    };

    function saveApiKey() {
      const key = document.getElementById('apiKeyInput').value.trim();
      if (!key) return alert('API 키를 입력해주세요.');
      localStorage.setItem('GEMINI_API_KEY', key);
      alert('브라우저에 API 키가 안전하게 저장되었습니다.');
    }

    function startTest() {
      const apiKey = localStorage.getItem('GEMINI_API_KEY') || document.getElementById('apiKeyInput').value.trim();
      if (!apiKey) return alert('먼저 상단에 Gemini API 키를 입력하고 [저장]을 눌러주세요!');
      document.getElementById('surveySection').classList.add('hidden');
      document.getElementById('testSection').classList.remove('hidden');
      renderQuestion(0);
    }

    function renderNavTabs() {
      const nav = document.getElementById('navTabs');
      nav.innerHTML = questions.map((q, idx) => {
        const isCurrent = idx === currentQIndex;
        const hasAttempt = q.attempts.length > 0;
        const latestGrade = hasAttempt ? `(${q.attempts[q.attempts.length - 1].result.estimated_grade})` : '';
        return `<button onclick="renderQuestion(${idx})" 
                  class="px-4 py-1.5 rounded-lg text-sm font-semibold transition ${isCurrent ? 'bg-indigo-600 text-white shadow' : 'bg-white text-slate-600 border'}">
                  문제 ${idx + 1} ${latestGrade}
                </button>`;
      }).join('');
    }

    function renderQuestion(index) {
      if (isRecording) toggleRecording();
      currentQIndex = index;
      const q = questions[index];
      renderNavTabs();

      document.getElementById('qCategory').innerText = q.category;
      const qTextEl = document.getElementById('qText');
      qTextEl.innerText = q.text;
      qTextEl.classList.add('hidden');

      const latestTranscript = q.attempts.length > 0 ? q.attempts[q.attempts.length - 1].transcript : '';
      document.getElementById('answerInput').value = latestTranscript;

      renderAttempts(q.attempts.length - 1);
    }

    function toggleScript() { document.getElementById('qText').classList.toggle('hidden'); }
    function playQuestionTTS() {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(questions[currentQIndex].text);
      utterance.lang = 'en-US';
      utterance.rate = 0.95;
      window.speechSynthesis.speak(utterance);
    }

    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return;
      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.continuous = true;
      recognition.interimResults = false;

      recognition.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          if (event.results[i].isFinal) transcript += event.results[i][0].transcript + ' ';
        }
        const input = document.getElementById('answerInput');
        input.value = (input.value + ' ' + transcript).trim();
      };

      recognition.onend = () => { if (isRecording) recognition.start(); };
    }

    function toggleRecording() {
      if (!recognition) return alert('이 브라우저는 음성 인식을 지원하지 않습니다. 크롬 브라우저를 사용해 주세요.');
      const btn = document.getElementById('recordBtn');
      if (!isRecording) {
        isRecording = true;
        recognition.start();
        btn.innerText = '⏹ 녹음 종료';
        btn.classList.replace('bg-rose-600', 'bg-slate-800');
      } else {
        isRecording = false;
        recognition.stop();
        btn.innerText = '● 녹음 시작 (영어)';
        btn.classList.replace('bg-slate-800', 'bg-rose-600');
      }
    }

    async function evaluateAnswer() {
      const apiKey = localStorage.getItem('GEMINI_API_KEY') || document.getElementById('apiKeyInput').value.trim();
      if (!apiKey) return alert('상단에 Gemini API Key를 먼저 입력하고 저장해 주세요!');

      const transcript = document.getElementById('answerInput').value.trim();
      if (!transcript) return alert('답변을 녹음하거나 텍스트로 입력해 주세요.');
      if (isRecording) toggleRecording();

      const btn = document.getElementById('evalBtn');
      btn.disabled = true;
      btn.innerText = '⏳ ACTFL 평가관이 MP 두괄식 구조를 분석 중입니다...';

      const q = questions[currentQIndex];
      const prompt = `
당신은 공인 ACTFL OPIc 수석 평가관입니다. 응시자의 목표 등급은 'AL (Advanced Low)'입니다.
응시자는 답변 시 **첫 문장에 MP(Main Point, 핵심 결론)가 먼저 나오는 두괄식 구조**로 말하는 것을 목표로 합니다.

[질문]: ${q.text}
[사용자 답변]: ${transcript}

다음 JSON 스키마를 정확히 지켜서 응답하세요:
{
  "estimated_grade": "IM2, IM3, IH, AL 중 하나",
  "overall_comment": "첫 문장 MP(두괄식) 선제시 여부를 포함한 전체 총평 (한국어 2문장)",
  "actfl_evaluation": {
    "functions_tasks": { "score": "상/중/하", "feedback": "과제 수행력 및 시제 피드백" },
    "context_content": { "score": "상/중/하", "feedback": "스토리라인 및 디테일 피드백" },
    "accuracy": { "score": "상/중/하", "feedback": "문법 오류 교정 및 필러 활용 피드백" },
    "text_type": { "score": "상/중/하", "feedback": "첫 문장 MP(두괄식 결론) 제시 여부 및 문단 구성력 피드백" }
  },
  "al_upgrade_points": [
    "첫 문장에 명확한 MP(Main Point)를 꽂기 위한 팁",
    "AL 등급을 위한 핵심 개선점"
  ],
  "al_model_answer": "첫 문장에 자연스러운 필러와 강력한 MP(Main Point)를 먼저 던지고 시작하는 두괄식 AL 모범 스크립트 (영어)"
}`;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: { responseMimeType: "application/json" }
          })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message);

        let rawText = data.candidates[0].content.parts[0].text.trim();
        rawText = rawText.replace(/^```json/i, '').replace(/^```/, '').replace(/```$/, '').trim();
        const resultJson = JSON.parse(rawText);

        q.attempts.push({
          attemptNum: q.attempts.length + 1,
          transcript: transcript,
          result: resultJson
        });

        renderNavTabs();
        renderAttempts(q.attempts.length - 1);
      } catch (err) {
        alert('채점 중 오류가 발생했습니다: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = '✅ ACTFL 및 MP 두괄식 채점 받기 (재도전)';
      }
    }

    function renderAttempts(attemptIdx) {
      const q = questions[currentQIndex];
      const container = document.getElementById('feedbackContainer');
      if (q.attempts.length === 0) {
        container.classList.add('hidden');
        return;
      }
      container.classList.remove('hidden');

      const tabsEl = document.getElementById('attemptTabs');
      tabsEl.innerHTML = q.attempts.map((att, idx) => `
        <button onclick="renderAttempts(${idx})" 
                class="px-2.5 py-1 rounded text-xs font-bold ${idx === attemptIdx ? 'bg-indigo-600 text-white' : 'bg-slate-200 text-slate-600'}">
          #${att.attemptNum}차 (${att.result.estimated_grade})
        </button>
      `).join('');

      const item = q.attempts[attemptIdx];
      const r = item.result;
      document.getElementById('feedbackContent').innerHTML = `
        <div class="bg-slate-900 text-white p-4 rounded-xl flex items-center justify-between">
          <div>
            <span class="text-xs text-slate-400">ACTFL 예상 등급 (#${item.attemptNum}차 시도)</span>
            <p class="text-sm mt-1 text-slate-200">${r.overall_comment}</p>
          </div>
          <div class="text-3xl font-extrabold text-amber-400 shrink-0 ml-4">${r.estimated_grade}</div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-sm">
          <div class="border p-3 rounded-xl bg-slate-50">
            <div class="font-bold text-slate-700 mb-1">🎯 1. 과제 수행 : <span class="text-indigo-600">${r.actfl_evaluation.functions_tasks.score}</span></div>
            <p class="text-slate-600 text-xs leading-relaxed">${r.actfl_evaluation.functions_tasks.feedback}</p>
          </div>
          <div class="border p-3 rounded-xl bg-slate-50">
            <div class="font-bold text-slate-700 mb-1">💡 2. 맥락/내용 : <span class="text-indigo-600">${r.actfl_evaluation.context_content.score}</span></div>
            <p class="text-slate-600 text-xs leading-relaxed">${r.actfl_evaluation.context_content.feedback}</p>
          </div>
          <div class="border p-3 rounded-xl bg-slate-50">
            <div class="font-bold text-slate-700 mb-1">🔍 3. 정확성 : <span class="text-indigo-600">${r.actfl_evaluation.accuracy.score}</span></div>
            <p class="text-slate-600 text-xs leading-relaxed">${r.actfl_evaluation.accuracy.feedback}</p>
          </div>
          <div class="border p-3 rounded-xl bg-slate-50">
            <div class="font-bold text-slate-700 mb-1">🧱 4. MP 두괄식 & 텍스트 유형 : <span class="text-indigo-600">${r.actfl_evaluation.text_type.score}</span></div>
            <p class="text-slate-600 text-xs leading-relaxed">${r.actfl_evaluation.text_type.feedback}</p>
          </div>
        </div>

        <div class="bg-amber-50 border border-amber-200 p-4 rounded-xl text-sm">
          <div class="font-bold text-amber-900 mb-2">🚀 AL 달성을 위한 MP 선제시 개선 포인트</div>
          <ul class="list-disc pl-5 space-y-1 text-amber-800 text-xs">
            ${r.al_upgrade_points.map(pt => `<li>${pt}</li>`).join('')}
          </ul>
        </div>

        <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-xl text-sm">
          <div class="font-bold text-emerald-900 mb-1">✨ 첫 문장 MP 선제시 AL 모범 스크립트</div>
          <p class="text-emerald-800 text-xs leading-relaxed italic">"${r.al_model_answer}"</p>
        </div>
      `;
    }
  </script>
</body>
</html>
